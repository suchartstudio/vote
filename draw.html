<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สุ่มหมายเลขผู้สมัคร</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow text-center max-w-md w-full">
        <h1 class="text-2xl font-bold mb-6">สุ่มหมายเลขผู้สมัคร</h1>
        <button id="drawBtn" class="bg-purple-600 text-white px-6 py-3 rounded text-xl w-full">เริ่มจับฉลากหมายเลข</button>
        <ul id="resultList" class="mt-6 text-left space-y-2"></ul>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        document.getElementById('drawBtn').onclick = async () => {
            const snapshot = await get(ref(db, 'candidates'));
            if (snapshot.exists()) {
                const data = snapshot.val();
                let keys = Object.keys(data);
                
                // Shuffle keys array
                for (let i = keys.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [keys[i], keys[j]] = [keys[j], keys[i]];
                }

                let updates = {};
                const listEl = document.getElementById('resultList');
                listEl.innerHTML = '';

                keys.forEach((key, index) => {
                    let number = index + 1;
                    updates[`candidates/${key}/number`] = number;
                    listEl.innerHTML += `<li class="text-lg border-b pb-2">หมายเลข <b>${number}</b> : ${data[key].name}</li>`;
                });

                await update(ref(db), updates);
                alert('สุ่มหมายเลขและบันทึกลงฐานข้อมูลสำเร็จ!');
            }
        };
    </script>
</body>
</html>
