<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มหมายเลขผู้สมัคร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* เอฟเฟกต์เด้งขึ้นมาเมื่อเปิดเผยหมายเลขจริง */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* เอฟเฟกต์สั่นเบาๆ ขณะกำลังสุ่ม */
        @keyframes shake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        .animate-shake {
            animation: shake 0.1s infinite;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">
    
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="bg-purple-600 text-white p-6 text-center relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 text-7xl opacity-10">🎲</div>
            <h1 class="text-2xl md:text-3xl font-extrabold mb-1">🎲 สุ่มจับฉลากหมายเลขผู้สมัคร</h1>
            <p class="text-purple-100 text-sm">ระบบสุ่มตัวเลขผู้สมัครเลือกตั้งแบบโปร่งใส</p>
        </div>

        <div class="p-6">
            <!-- ปุ่มกดเริ่มสุ่ม -->
            <button id="drawBtn" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                <span>🎲 เริ่มสุ่มจับฉลากหมายเลข</span>
            </button>

            <!-- ข้อความแสดงสถานะ -->
            <p id="statusText" class="text-center text-sm font-semibold text-purple-600 mt-3 h-6"></p>

            <!-- รายชื่อผู้สมัคร -->
            <div id="candidateContainer" class="mt-4 space-y-3">
                <div class="text-center text-gray-400 py-8">กำลังโหลดข้อมูลผู้สมัคร...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const drawBtn = document.getElementById('drawBtn');
        const statusText = document.getElementById('statusText');
        const candidateContainer = document.getElementById('candidateContainer');

        let candidatesData = {};
        let isDrawing = false;

        // 1. โหลดข้อมูลผู้สมัครมาแสดงเริ่มต้น
        onValue(ref(db, 'candidates'), (snapshot) => {
            if (snapshot.exists()) {
                candidatesData = snapshot.val();
                if (!isDrawing) {
                    renderCandidates(candidatesData);
                }
            } else {
                candidateContainer.innerHTML = `<div class="text-center text-gray-400 py-8">ยังไม่มีข้อมูลผู้สมัครในระบบ (กรุณาเพิ่มผู้สมัครในหน้า Admin ก่อน)</div>`;
                drawBtn.disabled = true;
                drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        // ฟังก์ชันวาดการ์ดผู้สมัคร
        function renderCandidates(data, tempNumbers = null, isFinal = false) {
            let keys = Object.keys(data);
            candidateContainer.innerHTML = '';

            keys.forEach((key) => {
                const item = data[key];
                // ใช้ตัวเลขชั่วคราวขณะสุ่ม ถ้าไม่มีให้ใช้เบอร์จริงใน DB
                const displayNum = tempNumbers ? tempNumbers[key] : (item.number || '?');
                
                candidateContainer.innerHTML += `
                    <div class="flex items-center justify-between p-4 rounded-xl border transition-all ${isFinal ? 'animate-pop border-purple-300 bg-purple-50 shadow-md' : 'bg-gray-50 border-gray-200'}">
                        <div class="flex items-center gap-4">
                            <img src="${item.photo || 'https://via.placeholder.com/60'}" class="w-14 h-14 rounded-full object-cover border shadow-sm shrink-0">
                            <div>
                                <h3 class="font-bold text-gray-800 text-lg">${item.name}</h3>
                                <p class="text-xs text-gray-500 line-clamp-1">${item.details || 'ไม่มีรายละเอียด'}</p>
                            </div>
                        </div>
                        
                        <!-- กล่องแสดงหมายเลข -->
                        <div class="flex items-center justify-center w-14 h-14 rounded-xl shadow border-2 font-black text-2xl transition-all shrink-0 ${tempNumbers ? 'animate-shake bg-purple-100 text-purple-600 border-purple-400' : (isFinal ? 'bg-purple-600 text-white border-purple-700 scale-110 shadow-lg' : 'bg-white text-gray-700 border-gray-200')}">
                            ${displayNum}
                        </div>
                    </div>
                `;
            });
        }

        // 2. เมื่อกดปุ่มสุ่มจับฉลาก
        drawBtn.onclick = async () => {
            let keys = Object.keys(candidatesData);
            if (keys.length === 0 || isDrawing) return;

            isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
            drawBtn.innerHTML = `<span>⏳ กำลังสุ่มจับฉลาก...</span>`;
            statusText.innerText = "🌀 กำลังสุ่มเปลี่ยนตัวเลข...";

            // คำนวณผลลัพธ์ล่วงหน้า (Fisher-Yates Shuffle)
            let shuffledKeys = [...keys];
            for (let i = shuffledKeys.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledKeys[i], shuffledKeys[j]] = [shuffledKeys[j], shuffledKeys[i]];
            }

            // จับคู่ Key ของผู้สมัครกับเบอร์จริง (1, 2, 3, ...)
            let finalMapping = {};
            shuffledKeys.forEach((key, index) => {
                finalMapping[key] = index + 1;
            });

            // --- เริ่มเล่น ANIMATION สุ่มตัวเลขรัวๆ ---
            let totalTicks = 35; // เปลี่ยนตัวเลขรัวๆ 35 รอบ (ประมาณ 2.1 วินาที)
            let currentTick = 0;

            const interval = setInterval(() => {
                currentTick++;
                
                // สุ่มสลับตัวเลขหลอกชั่วคราวเพื่อสร้างภาพเคลื่อนไหว
                let tempNumbers = {};
                let availableNums = Array.from({length: keys.length}, (_, i) => i + 1);
                
                keys.forEach(key => {
                    const randomIndex = Math.floor(Math.random() * availableNums.length);
                    tempNumbers[key] = availableNums.splice(randomIndex, 1)[0];
                });

                renderCandidates(candidatesData, tempNumbers, false);

                // เมื่อสุ่มครบรอบเวลาที่กำหนด
                if (currentTick >= totalTicks) {
                    clearInterval(interval);
                    finishDraw(finalMapping);
                }
            }, 60); // สลับตัวเลขทุกๆ 60 มิลลิวินาที
        };

        // 3. จบขั้นตอนสุ่ม และบันทึกลง Firebase
        async function finishDraw(finalMapping) {
            try {
                // อัปเดตเบอร์ลงฐานข้อมูล Firebase
                let updates = {};
                Object.keys(finalMapping).forEach(key => {
                    updates[`candidates/${key}/number`] = finalMapping[key];
                });

                await update(ref(db), updates);

                // แสดงผลลัพธ์สุดท้ายพร้อม Animation เด้ง (isFinal = true)
                renderCandidates(candidatesData, finalMapping, true);

                statusText.innerText = "🎉 จับฉลากและบันทึกหมายเลขเรียบร้อยแล้ว!";
                drawBtn.disabled = false;
                drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                drawBtn.innerHTML = `<span>🎲 สุ่มจับฉลากใหม่อีกครั้ง</span>`;
                isDrawing = false;

            } catch (err) {
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + err.message);
                isDrawing = false;
                drawBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
