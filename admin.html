<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการการเลือกตั้ง (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-6 shadow-md mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">⚙️ แผงควบคุม (Admin Panel)</h1>
                <p class="text-indigo-200 text-sm mt-1">จัดการข้อมูลผู้สมัครและการตั้งค่าระบบ</p>
            </div>
            <a href="index.html" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm transition-all">🏠 กลับหน้าแรก</a>
        </div>
    </header>

    <div class="max-w-4xl mx-auto space-y-8 px-4">
        
        <!-- Section 1: ตั้งค่าระบบเลือกตั้ง -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">🛠️ ตั้งค่าระบบเลือกตั้ง</h2>
            <form id="settingsForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">ชื่อการเลือกตั้ง</label>
                    <input type="text" id="elecName" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">ละติจูด (Latitude)</label>
                    <input type="number" step="any" id="elecLat" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">ลองจิจูด (Longitude)</label>
                    <input type="number" step="any" id="elecLng" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">รัศมีที่อนุญาต (เมตร)</label>
                    <input type="number" id="elecRadius" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div class="hidden md:block"></div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">เวลาเริ่มเปิดโหวต</label>
                    <input type="datetime-local" id="elecStart" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">เวลาปิดโหวต</label>
                    <input type="datetime-local" id="elecEnd" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div class="md:col-span-2 text-right mt-2">
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-700 shadow-md">💾 บันทึกการตั้งค่า</button>
                </div>
            </form>
        </div>

        <!-- Section 2: จัดการผู้สมัคร -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2">👥 รายชื่อผู้สมัคร</h2>
                <button onclick="openCandidateModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 shadow flex items-center gap-1">
                    ➕ เพิ่มผู้สมัคร
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3 rounded-tl-lg">เบอร์</th>
                            <th class="p-3">รูปภาพ</th>
                            <th class="p-3">ชื่อ-นามสกุล</th>
                            <th class="p-3">คะแนน</th>
                            <th class="p-3 rounded-tr-lg text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="candidatesTableBody" class="divide-y divide-gray-200">
                        <!-- รายชื่อผู้สมัครจะถูกเพิ่มที่นี่ -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal เพิ่ม/แก้ไขผู้สมัคร -->
    <div id="candidateModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold">เพิ่มผู้สมัคร</h3>
                <button onclick="closeCandidateModal()" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            
            <form id="candidateForm" class="p-6 space-y-4">
                <input type="hidden" id="candId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="candName" class="w-full border border-gray-300 rounded-lg p-3" required>
                    </div>

                    <!-- ช่องกรอก/แก้ไขหมายเลขผู้สมัคร -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">หมายเลข (เบอร์)</label>
                        <input type="number" id="candNumber" class="w-full border border-gray-300 rounded-lg p-3 text-lg font-bold text-indigo-700" placeholder="ว่างไว้เพื่อสุ่มภายหลัง">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">URL รูปถ่าย (ใส่ลิงก์รูป)</label>
                        <input type="url" id="candPhoto" class="w-full border border-gray-300 rounded-lg p-3" placeholder="https://...">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">รายละเอียด / นโยบาย</label>
                    <textarea id="candDetails" rows="3" class="w-full border border-gray-300 rounded-lg p-3"></textarea>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeCandidateModal()" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-semibold hover:bg-gray-300">ยกเลิก</button>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700 shadow-md">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get, set, update, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // โหลดข้อมูลการตั้งค่า
        onValue(ref(db, 'settings'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('elecName').value = data.name || '';
                document.getElementById('elecLat').value = data.lat || '';
                document.getElementById('elecLng').value = data.lng || '';
                document.getElementById('elecRadius').value = data.radius || '';
                document.getElementById('elecStart').value = data.start || '';
                document.getElementById('elecEnd').value = data.end || '';
            }
        });

        // บันทึกการตั้งค่า
        document.getElementById('settingsForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await set(ref(db, 'settings'), {
                    name: document.getElementById('elecName').value,
                    lat: parseFloat(document.getElementById('elecLat').value),
                    lng: parseFloat(document.getElementById('elecLng').value),
                    radius: parseInt(document.getElementById('elecRadius').value),
                    start: document.getElementById('elecStart').value,
                    end: document.getElementById('elecEnd').value
                });
                alert("บันทึกการตั้งค่าระบบเรียบร้อยแล้ว");
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            }
        };

        // ตัวแปรเก็บข้อมูลผู้สมัครชั่วคราว
        let candidatesData = {};

        // โหลดข้อมูลผู้สมัคร (Realtime)
        onValue(ref(db, 'candidates'), (snapshot) => {
            const tbody = document.getElementById('candidatesTableBody');
            tbody.innerHTML = '';
            
            if (snapshot.exists()) {
                candidatesData = snapshot.val();
                const keys = Object.keys(candidatesData);
                
                // เรียงตามหมายเลขเบอร์
                keys.sort((a, b) => (candidatesData[a].number || 999) - (candidatesData[b].number || 999));

                keys.forEach(key => {
                    const c = candidatesData[key];
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-3">
                                <span class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full border border-indigo-200">
                                    ${c.number || '-'}
                                </span>
                            </td>
                            <td class="p-3">
                                <img src="${c.photo || 'https://via.placeholder.com/50'}" class="w-12 h-12 rounded-full object-cover border shadow-sm">
                            </td>
                            <td class="p-3 font-semibold text-gray-800">${c.name}</td>
                            <td class="p-3 text-green-600 font-bold">${c.votes || 0}</td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="openCandidateModal('${key}')" class="text-blue-500 hover:text-blue-700 font-semibold bg-blue-50 px-3 py-1 rounded">✏️ แก้ไข</button>
                                <button onclick="deleteCandidate('${key}')" class="text-red-500 hover:text-red-700 font-semibold bg-red-50 px-3 py-1 rounded">🗑️ ลบ</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                candidatesData = {};
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">ยังไม่มีข้อมูลผู้สมัคร</td></tr>`;
            }
        });

        // เปิด Modal แจ้งฟอร์ม
        window.openCandidateModal = (id = null) => {
            const modal = document.getElementById('candidateModal');
            const form = document.getElementById('candidateForm');
            
            form.reset();
            document.getElementById('candId').value = '';

            if (id && candidatesData[id]) {
                document.getElementById('modalTitle').innerText = '✏️ แก้ไขข้อมูลผู้สมัคร';
                document.getElementById('candId').value = id;
                document.getElementById('candName').value = candidatesData[id].name;
                document.getElementById('candPhoto').value = candidatesData[id].photo || '';
                document.getElementById('candDetails').value = candidatesData[id].details || '';
                
                // ดึงหมายเลขมาใส่ในฟอร์ม
                document.getElementById('candNumber').value = candidatesData[id].number || '';
            } else {
                document.getElementById('modalTitle').innerText = '➕ เพิ่มผู้สมัครใหม่';
            }
            
            modal.classList.remove('hidden');
        };

        window.closeCandidateModal = () => {
            document.getElementById('candidateModal').classList.add('hidden');
        };

        // บันทึก หรือ อัปเดตข้อมูลผู้สมัคร
        document.getElementById('candidateForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('candId').value;
            const name = document.getElementById('candName').value;
            const photo = document.getElementById('candPhoto').value;
            const details = document.getElementById('candDetails').value;
            const numberVal = document.getElementById('candNumber').value;

            // จัดการข้อมูลหมายเลข ถ้ากรอกมาให้แปลงเป็นตัวเลข ถ้าไม่กรอกให้เป็น null (รอไปสุ่ม)
            const number = numberVal !== "" ? parseInt(numberVal) : null;

            try {
                if (id) {
                    // กรณีอัปเดต (ระวังอย่าให้คะแนนโหวตเดิมหายไป)
                    let updates = {
                        name: name,
                        photo: photo,
                        details: details,
                        number: number
                    };
                    await update(ref(db, `candidates/${id}`), updates);
                } else {
                    // กรณีเพิ่มใหม่
                    const newCandRef = push(ref(db, 'candidates'));
                    await set(newCandRef, {
                        name: name,
                        photo: photo,
                        details: details,
                        number: number,
                        votes: 0 // เริ่มต้นคะแนนโหวตเป็น 0
                    });
                }
                closeCandidateModal();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + err.message);
            }
        };

        // ลบผู้สมัคร
        window.deleteCandidate = async (id) => {
            if (confirm("คุณแน่ใจหรือไม่ว่าต้องการลบผู้สมัครท่านนี้?\n(คะแนนโหวตของผู้สมัครคนนี้จะถูกลบไปด้วย)")) {
                try {
                    await remove(ref(db, `candidates/${id}`));
                } catch (err) {
                    alert("เกิดข้อผิดพลาดในการลบ: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
