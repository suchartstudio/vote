<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงคะแนนเลือกตั้ง</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- ออกแบบเป็น Mobile First (กว้างสุดที่ max-w-md) -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow relative pb-10">
        <header class="bg-blue-600 text-white p-4 text-center sticky top-0 z-10">
            <h1 id="electionTitle" class="text-xl font-bold">กำลังโหลด...</h1>
        </header>

        <div id="statusMessage" class="p-4 text-center text-red-600 font-semibold mt-10">
            กำลังตรวจสอบตำแหน่งและเวลา...<br>
            <span class="text-sm text-gray-500 font-normal">(กรุณากดอนุญาตให้เข้าถึง GPS หากมีแจ้งเตือน)</span>
        </div>

        <div id="candidatesList" class="p-4 space-y-4 hidden">
            <!-- ผู้สมัครจะถูก Render ที่นี่ -->
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // สูตรคำนวณระยะทาง Haversine
        function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function initVoting() {
            try {
                const settingsSnap = await get(ref(db, 'settings'));
                
                // ตรวจสอบว่าแอดมินตั้งค่าระบบหรือยัง
                if (!settingsSnap.exists()) {
                    document.getElementById('statusMessage').innerText = "ยังไม่มีการตั้งค่าระบบการเลือกตั้ง กรุณาแจ้งแอดมินให้ตั้งค่าก่อน";
                    document.getElementById('electionTitle').innerText = "ยังไม่พร้อมใช้งาน";
                    return;
                }

                const settings = settingsSnap.val();
                document.getElementById('electionTitle').innerText = settings.name || "ระบบลงคะแนน";

                // ตรวจสอบเวลา
                const now = new Date();
                const startTime = new Date(settings.start);
                const endTime = new Date(settings.end);

                if (now < startTime || now > endTime) {
                    document.getElementById('statusMessage').innerHTML = `ขณะนี้ไม่อยู่ในช่วงเวลาลงคะแนน<br><span class="text-sm text-gray-500">(เปิดโหวต: ${startTime.toLocaleString('th-TH')} - ${endTime.toLocaleString('th-TH')})</span>`;
                    return;
                }

                // ตรวจสอบพิกัด
                if ("geolocation" in navigator) {
                    // ตั้งค่าการดึง GPS แบบกำหนดเวลา timeout ไว้ที่ 10 วินาที
                    const geoOptions = {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000 
                    };

                    navigator.geolocation.getCurrentPosition(async (position) => {
                        const distance = getDistanceFromLatLonInM(
                            position.coords.latitude, position.coords.longitude,
                            settings.lat, settings.lng
                        );

                        if (distance > settings.radius) {
                            document.getElementById('statusMessage').innerText = `คุณอยู่นอกพื้นที่ลงคะแนน (คุณอยู่ห่างจุดลงคะแนน ${Math.round(distance)} เมตร, อนุญาตเฉพาะ ${settings.radius} เมตร)`;
                            return;
                        }

                        // โหลดข้อมูลผู้สมัครเมื่อผ่านเงื่อนไขพิกัดและเวลา
                        const candsSnap = await get(ref(db, 'candidates'));
                        if (!candsSnap.exists()) {
                            document.getElementById('statusMessage').innerText = "ยังไม่มีข้อมูลผู้สมัครในระบบ";
                            return;
                        }

                        // แสดงรายชื่อผู้สมัคร
                        document.getElementById('statusMessage').classList.add('hidden');
                        const candidates = candsSnap.val();
                        const listEl = document.getElementById('candidatesList');
                        listEl.classList.remove('hidden');
                        listEl.innerHTML = ''; // เคลียร์ข้อความเก่า

                        let candsArray = Object.keys(candidates).map(key => ({ id: key, ...candidates[key] }));
                        candsArray.sort((a, b) => (a.number || 0) - (b.number || 0));

                        candsArray.forEach(c => {
                            listEl.innerHTML += `
                                <div class="border rounded-lg p-4 flex gap-4 items-center shadow-sm">
                                    <h2 class="text-3xl font-bold text-blue-600 w-12 text-center">${c.number || '-'}</h2>
                                    <img src="${c.photo || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-full object-cover">
                                    <div class="flex-1">
                                        <h3 class="font-bold text-lg">${c.name}</h3>
                                        <p class="text-sm text-gray-500 line-clamp-2">${c.details || ''}</p>
                                    </div>
                                    <button onclick="vote('${c.id}', ${c.votes || 0})" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 active:scale-95 transition-transform">โหวต</button>
                                </div>
                            `;
                        });

                    }, (error) => {
                        // ดักจับ Error หากดึง GPS ไม่สำเร็จ
                        let errorStr = "";
                        switch(error.code) {
                            case 1: errorStr = "คุณปฏิเสธการเข้าถึงตำแหน่ง (GPS) กรุณาอนุญาตในเบราว์เซอร์"; break;
                            case 2: errorStr = "ไม่สามารถหาพิกัดตำแหน่งของคุณได้"; break;
                            case 3: errorStr = "ใช้เวลาหาตำแหน่งนานเกินไป (Timeout) กรุณารีเฟรชหน้าเว็บ"; break;
                            default: errorStr = "เกิดข้อผิดพลาดในการดึงตำแหน่ง";
                        }
                        document.getElementById('statusMessage').innerText = errorStr;
                    }, geoOptions);

                } else {
                    document.getElementById('statusMessage').innerText = "อุปกรณ์หรือเบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง (GPS)";
                }

            } catch (err) {
                // ดักจับ Error ที่เกิดจากระบบ เช่น ฐานข้อมูลรวน
                document.getElementById('statusMessage').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err.message;
            }
        }

        window.vote = async (id, currentVotes) => {
            if(confirm("ยืนยันการลงคะแนน? (กดแล้วไม่สามารถยกเลิกได้)")) {
                try {
                    let updates = {};
                    updates[`candidates/${id}/votes`] = currentVotes + 1;
                    await update(ref(db), updates);
                    document.body.innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-screen bg-green-50 p-6 text-center">
                            <div class="text-6xl mb-4">✅</div>
                            <h1 class='text-2xl font-bold text-green-700 mb-2'>ลงคะแนนสำเร็จ</h1>
                            <p class='text-green-600'>ขอบคุณที่ร่วมใช้สิทธิในการเลือกตั้งครั้งนี้</p>
                            <a href="results.html" class="mt-8 bg-green-600 text-white px-6 py-3 rounded-full shadow-lg">ดูผลการลงคะแนน</a>
                        </div>
                    `;
                } catch(err) {
                    alert("เกิดข้อผิดพลาดในการบันทึกคะแนน: " + err.message);
                }
            }
        }

        initVoting();
    </script>
</body>
</html>
